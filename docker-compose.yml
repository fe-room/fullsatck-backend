services:
  mysql:
    image: mysql:8.0
    container_name: minishop-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: minishop
      MYSQL_USER: minishop
      MYSQL_PASSWORD: minishop123456
      TZ: Asia/Shanghai

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data: